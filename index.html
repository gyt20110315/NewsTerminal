    <meta property="og:description" content="AI-powered global news terminal with real-time analysis and DeepSeek AI insights." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

    <link rel="stylesheet" crossorigin href="./assets/index-BaQTisRg.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 版本标记 — 强制刷新时可见
      window.__NT_VERSION__ = 'v10-20260806-local-first';
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          // 每次加载检查更新，强制新 SW 接管
          reg.update();
          if (reg.active && reg.active.state === 'activated') {
            reg.addEventListener('updatefound', () => {
              const newSW = reg.installing;
              if (newSW) {
                newSW.addEventListener('statechange', () => {
                  if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                    // 新版本已安装，刷新以使用新版
                    window.location.reload();
                  }
                });
              }
            });
          }
        });
      }
    </script>
  </body>
